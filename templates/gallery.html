{% extends "base.html" %}

{% block title %}Gallery - AI Reel Generator{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
{% endblock %}

{% block content %}
<div class="container gallery-container">
    <h1 class="gallery-title">Reel Gallery</h1>
    <div class="gallery-grid">
        {% for reel in reels %}
        <div class="gallery-item">
            <div class="reel-card">
                <div class="reel-thumbnail">
                    <video controls preload="metadata" playsinline>
                        <source src="{{ url_for('reel_file', filename=reel) }}" type="video/mp4">
                        Your browser does not support video playback.
                    </video>
                </div>
                <div class="reel-info">
                    <h3>Reel {{ loop.index }}</h3>
                    <a class="reel-download" href="{{ url_for('download_reel', filename=reel) }}" aria-label="Download Reel {{ loop.index }}">
                        <i class="fas fa-download" aria-hidden="true"></i>
                        <span>Download</span>
                    </a>
                </div>
            </div>
        </div>
        {% else %}
        <p class="gallery-empty">No reels yet. Create a reel to see it here.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}

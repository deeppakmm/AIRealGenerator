{% extends "base.html" %}

{% block title %}Create Reel - AI Reel Generator{% endblock %}

{% block extra_css %} 
<link rel="stylesheet" href="{{ url_for('static', filename='css/create.css') }}">
{% endblock %}

{% block content %}
<section class="upload-section">
    <div class="container">
        <div class="upload-container">
            <h1 class="upload-title">Create Your Reel</h1>
            <p class="upload-instructions">Upload your video files to create an amazing reel. You can upload multiple files.</p>
            
            <!-- JavaScript shows messages in this box. -->
            <div id="js-error-box" style="display: none; color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 12px; border-radius: 5px; margin-bottom: 20px; font-weight: bold; font-family: sans-serif;">
            </div>

            <form action="/create" enctype="multipart/form-data" method="post" class="dropzone" id="myDropzone">
                <div class="fallback">
                    <div id="fileInputs">
                        <div class="file-input-group">
                            <!-- A file is required before submitting the form. -->
                            <input name="file1" type="file" class="file-input" required />
                            <button type="button" class="remove-file-btn" onclick="removeFileInput(this)" disabled>×</button>
                        </div>
                    </div>
                    <button type="button" class="add-file-btn" onclick="addFileInput()">+ Add File</button>
                </div>
                
                <div class="text-input-container">
                    <!-- Text is required before submitting the form. -->
                    <textarea class="text-input" id="textInput" name="text" placeholder="Enter your text to be added as voice here..." rows="4" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    Create Reel
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    let fileCounter = 2; // Start at 2 because file1 is already on the page.

    function addFileInput() {
        const fileInputs = document.getElementById('fileInputs');
        const newFileInput = document.createElement('div');
        newFileInput.className = 'file-input-group';
        newFileInput.innerHTML = `
            <input name="file${fileCounter}" type="file" class="file-input" required />
            <button type="button" class="remove-file-btn" onclick="removeFileInput(this)">×</button>
        `;
        fileInputs.appendChild(newFileInput);
        fileCounter++;
    }

    function removeFileInput(button) {
        const fileInputGroup = button.parentElement;
        fileInputGroup.remove();
    }

    // Handle the form and show the result when processing is done.
    document.getElementById('myDropzone').addEventListener('submit', function(event) {
        const textInput = document.getElementById('textInput').value.trim();
        const fileInputs = document.querySelectorAll('.file-input');
        const errorBox = document.getElementById('js-error-box');
        const submitBtn = document.getElementById('submitBtn');
        
        let hasFile = false;
        
        // Check that at least one file was selected.
        fileInputs.forEach(input => {
            if (input.files.length > 0) {
                hasFile = true;
            }
        });

        if (textInput === "") {
            event.preventDefault();
            errorBox.innerText = "⚠️ Please enter some text description!";
            errorBox.style.style.display = "block";
            window.scrollTo(0, 0);
            return false;
        }

        if (!hasFile) {
            event.preventDefault();
            errorBox.innerText = "⚠️ Please select at least one file/image!";
            errorBox.style.display = "block";
            window.scrollTo(0, 0);
            return false;
        }

        // Hide the old message and send the form with fetch.
        errorBox.style.display = "none";
        event.preventDefault(); 

        // Show a processing state while the reel is being created.
        submitBtn.disabled = true;
        submitBtn.style.backgroundColor = "#ffc107"; // Yellow
        submitBtn.style.color = "#000";
        submitBtn.innerHTML = "⏳ Your Reel is processing... Please wait 🎬";

        const formData = new FormData(this);

        // Send the form data to the server.
        fetch('/create', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json()) 
        .then(data => {
            if (data.status === "success") {
                // Show a success message when the server finishes creating the reel.
                submitBtn.style.backgroundColor = "#28a745"; // Green
                submitBtn.style.color = "#fff";
                submitBtn.innerHTML = "Your Reel is created! 🎉";

                // Show a success message with a link to the gallery.
                errorBox.style.backgroundColor = "#d4edda";
                errorBox.style.color = "#155724";
                errorBox.style.borderColor = "#c3e6cb";
                errorBox.innerHTML = `
                    <h3>✨ Boom! Your Reel is Ready!</h3>
                    <p>Your awesome Reel has been successfully created. Head over to your Gallery section to check it out! 🍿</p>
                    <a href="/gallery" style="display: inline-block; margin-top: 10px; background: #007bff; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; font-weight: normal;">Go to Gallery ➡️</a>
                `;
                errorBox.style.display = "block";
                window.scrollTo(0, 0);
                window.setTimeout(() => window.location.assign("/gallery"), 1200);
            } else {
                throw new Error(data.message || "Something went wrong");
            }
        })
        .catch(error => {
            // Reset the button and show the error message.
            submitBtn.disabled = false;
            submitBtn.style.backgroundColor = ""; 
            submitBtn.style.color = "";
            submitBtn.innerHTML = "Create Reel";
            errorBox.style.backgroundColor = "#f8d7da";
            errorBox.style.color = "#721c24";
            errorBox.style.borderColor = "#f5c6cb";
            errorBox.innerText = "❌ Error: " + error.message;
            errorBox.style.display = "block";
        });
    });
</script>
{% endblock %}
